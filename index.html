<!DOCTYPE html>
<html lang="zh-CN" data-theme="purple" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="拾光日程：离线可用的个人日程、心情、读书、待办与写作记录本。">
  <title>拾光日程 · 个人日程记录</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/extensions.css">
  <link rel="stylesheet" href="css/notebook.css">
  <link rel="stylesheet" href="css/schedule.css">

</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>

  <header class="site-header" id="siteHeader">
    <div class="nav-inner">
      <a class="brand" href="#/year" aria-label="拾光日程首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34" fill="none">
            <rect x="5" y="7" width="30" height="28" rx="9" fill="currentColor" opacity=".14"/>
            <path d="M12 4.5v6M28 4.5v6M7 14h26" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M12.5 21.5c3.4-4.2 5.8-4.2 7.5 0 1.7 4.2 4.1 4.2 7.5 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="14" cy="28.5" r="1.4" fill="currentColor"/>
            <circle cx="20" cy="28.5" r="1.4" fill="currentColor" opacity=".55"/>
            <circle cx="26" cy="28.5" r="1.4" fill="currentColor" opacity=".3"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>拾光日程</strong>
          <small>PERSONAL PLANNER</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="主导航">
        <a class="nav-link" data-nav="year" href="#/year">年份</a>
        <a class="nav-link" data-nav="month" href="#/month">月份</a>
        <a class="nav-link" data-nav="day" href="#/day">每日</a>
        <a class="nav-link" data-nav="week" href="#/week">每周</a>
        <a class="nav-link" data-nav="books" href="#/books">读书笔记</a>
        <a class="nav-link" data-nav="todos" href="#/todos">待办</a>
        <a class="nav-link" data-nav="tasks" href="#/tasks">长期任务</a>
        <a class="nav-link" data-nav="writing" href="#/writing">写作</a>
      </nav>

      <div class="nav-tools">
        <button class="sync-chip" type="button" data-sync-status data-state="idle" aria-label="同步状态：未登录" title="同步状态：未登录">
          <span class="sync-dot" aria-hidden="true"></span>
          <span class="sync-text">未登录</span>
        </button>
        <div class="theme-choice" role="group" aria-label="配色主题">
          <button class="theme-dot is-purple" type="button" data-theme-choice="purple" aria-label="紫色主题" title="紫色主题"><span></span></button>
          <button class="theme-dot is-blue" type="button" data-theme-choice="blue" aria-label="蓝色主题" title="蓝色主题"><span></span></button>
        </div>
        <button class="settings-toggle" type="button" data-open-settings aria-label="设置与数据备份" title="设置与数据备份">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19.2 13.6a7.8 7.8 0 0 0 .1-1.6 7.8 7.8 0 0 0-.1-1.6l2-1.5-2-3.4-2.4 1a8.2 8.2 0 0 0-2.7-1.6L13.8 2h-3.6L9.8 5a8.2 8.2 0 0 0-2.7 1.6l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0-.1 1.6 7.8 7.8 0 0 0 .1 1.6l-2 1.5 2 3.4 2.4-1a8.2 8.2 0 0 0 2.7 1.6l.4 3h3.6l.4-3a8.2 8.2 0 0 0 2.7-1.6l2.4 1 2-3.4-2.1-1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="mode-switch" type="button" data-mode-toggle aria-label="切换到夜间模式" title="切换日间 / 夜间模式">
          <span class="mode-thumb" aria-hidden="true"></span>
          <svg class="mode-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="mode-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
            <path d="M20.2 14.2A8.3 8.3 0 0 1 9.8 3.8a8.4 8.4 0 1 0 10.4 10.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="menu-toggle" type="button" data-menu-toggle aria-label="打开菜单" aria-expanded="false" aria-controls="mobileMenu">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="mobile-menu" id="mobileMenu" hidden>
      <nav aria-label="移动端主导航">
        <a data-nav="year" href="#/year"><span>01</span>年份</a>
        <a data-nav="month" href="#/month"><span>02</span>月份</a>
        <a data-nav="day" href="#/day"><span>03</span>每日</a>
        <a data-nav="week" href="#/week"><span>04</span>每周</a>
        <a data-nav="books" href="#/books"><span>05</span>读书笔记</a>
        <a data-nav="todos" href="#/todos"><span>06</span>待办</a>
        <a data-nav="tasks" href="#/tasks"><span>07</span>长期任务</a>
        <a data-nav="writing" href="#/writing"><span>08</span>写作</a>
      </nav>
      <button class="mobile-sync" type="button" data-sync-status data-state="idle" aria-label="同步状态：未登录" title="同步状态：未登录">
        <span class="sync-dot" aria-hidden="true"></span>
        <span class="sync-text">未登录</span>
      </button>
    </div>
  </header>

  <main class="page" id="view" tabindex="-1">
    <div class="boot-screen">
      <span class="boot-mark" aria-hidden="true">拾</span>
      <p>正在翻开你的日程本…</p>
    </div>
  </main>

  <footer class="site-footer">
    <span>拾光日程 <b>v1.1</b></span>
    <span>内容默认只存在这台设备的浏览器里，可在「设置 → 同步与账号」开启多设备同步</span>
    <span>愿每一天都有迹可循</span>
  </footer>

  <noscript>
    <div class="noscript">这个日程本需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。</div>
  </noscript>

  <script src="js/attachments.js" defer></script>
  <script src="js/sync-github.js" defer></script>
  <script src="js/seed.js" defer></script>
  <script src="js/backup.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/pages/year.js" defer></script>
  <script src="js/pages/month.js" defer></script>
  <script src="js/pages/month-summary.js" defer></script>
  <script src="js/pages/day.js" defer></script>

  <script src="js/pages/mood.js" defer></script>
  <script src="js/pages/books.js" defer></script>
  <script src="js/notebook.js" defer></script>
